name: Fetch Orbital Clip
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video id
        required: true
        default: tiOl_mcAsF4
  # Auto-download disabled 2026-09-26 by user direction: the app imports
  # background videos via a YouTube link instead ("instead of downloading
  # videos, just make him import it via a YouTube link"). Manual dispatch
  # remains available for seeding the cache when needed.

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Start Cloudflare WARP proxy (warproxy)
        id: warp
        run: |
          # YouTube does not blacklist Cloudflare WARP egress IPs (verified by
          # probe run 36068187416 — download succeeded through this proxy).
          # Cloudflare rate-limits NEW WARP account registration (429) per IP, so
          # once any run registers successfully the account files are committed
          # to .github/warp/ and mounted into the container on every later run —
          # skipping registration entirely.
          exec > >(tee -a /tmp/warp.log) 2>&1
          set -x
          mkdir -p .github/warp
          start_warp() {
            docker rm -f warproxy 2>/dev/null || true
            local mount=()
            if [ -f .github/warp/wgcf-account.toml ]; then
              mount=(-v "$PWD/.github/warp:/config")
              echo "mounting persisted WARP account"
            else
              echo "no persisted WARP account — fresh registration (may 429)"
            fi
            docker run -d --name warproxy \
              -p 1080:1080 -p 127.0.0.1:3128:3128 -e HTTP_PORT=3128 \
              --cap-add NET_ADMIN --device /dev/net/tun \
              "${mount[@]}" \
              ghcr.io/kingcc/warproxy:latest
          }
          check_ready() {
            curl -sf --max-time 4 --proxy socks5h://127.0.0.1:1080 \
              https://www.cloudflare.com/cdn-cgi/trace > /tmp/warp_trace.txt 2>/dev/null \
              && grep -q '^warp=on' /tmp/warp_trace.txt
          }
          wait_ready() {
            local tries="$1"
            for i in $(seq 1 "$tries"); do
              if check_ready; then
                echo "WARP proxy ready (try $i):"
                grep -E '^(ip|loc|warp)=' /tmp/warp_trace.txt || true
                return 0
              fi
              sleep 3
            done
            return 1
          }
          # Pass 1: persisted account (or fresh registration when none stored).
          start_warp
          if wait_ready 50; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
            docker cp warproxy:/config/. .github/warp/ 2>/dev/null || true
            ls -la .github/warp/ || true
            exit 0
          fi
          docker logs warproxy 2>&1 | tail -40
          # Pass 2: persisted account may be dead — drop it and register fresh.
          rm -f .github/warp/wgcf-account.toml .github/warp/wgcf-profile.conf .github/warp/wireproxy.conf
          start_warp
          if wait_ready 50; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
            docker cp warproxy:/config/. .github/warp/ 2>/dev/null || true
            ls -la .github/warp/ || true
            exit 0
          fi
          echo "WARPROXY_NOT_READY — falling back to direct attempts"
          docker logs warproxy 2>&1 | tail -60
          docker ps -a | grep -i warp || true
          echo "ready=0" >> "$GITHUB_OUTPUT"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deno (yt-dlp JS runtime)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install tools
        run: |
          python -m pip install -U --pre "yt-dlp[default]" bgutil-ytdlp-pot-provider || python -m pip install -U yt-dlp bgutil-ytdlp-pot-provider
          yt-dlp --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          yt-dlp --version
          deno --version | head -1
      - name: Clone yt-download engine (custom Innertube, no yt-dlp)
        run: |
          git clone --depth 1 https://github.com/Str4hinj47/yt-download /tmp/yt-download
          cd /tmp/yt-download
          # The repo currently ships flat, but cli.py/app.py import `engine.*`
          # and Flask wants templates/index.html (README layout). Shim it here
          # until the repo layout itself is fixed.
          if [ ! -d engine ]; then
            mkdir -p engine templates
            cp -f __init__.py innertube.py probe.py engine/
            [ -f index.html ] && cp -f index.html templates/ || true
          fi
          python -m pip install -q requests pysocks
          python3 cli.py -h | head -3
      - name: Start PO-token provider
        run: |
          docker run -d --name bgutil -p 127.0.0.1:4416:4416 --init \
            brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4416/ >/dev/null; then
              echo "pot provider ready"
              break
            fi
            sleep 1
          done
          curl -sS http://127.0.0.1:4416/ || echo "pot provider not answering"
      - name: Determine video id
        id: vid
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VID="${{ inputs.video_id }}"
          else
            VID="$(head -1 .github/fetch-orbital.trigger | tr -d '\r\n' | head -1)"
          fi
          VID="${VID%%#*}"
          echo "id=$VID" >> "$GITHUB_OUTPUT"
          echo "Using video id: $VID"
      - name: Download Orbital section
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          WARP_READY: ${{ steps.warp.outputs.ready }}
        run: |
          set -x
          mkdir -p background_cache/minecraft_parkour/downloads
          VID="${{ steps.vid.outputs.id }}"
          OUT="background_cache/minecraft_parkour/downloads/orbital_${VID}"
          : > /tmp/ytdlp.log
          : > /tmp/attempts.log
          echo "warp_ready=$WARP_READY" | tee -a /tmp/attempts.log

          # Cookies only matter on the direct (no-WARP) fallback path; a rotated
          # cookie set poisons every client, so never send them through WARP.
          COOKIE_ARGS=()
          if [ -n "$YT_COOKIES" ] && [ "$WARP_READY" != "1" ]; then
            printf '%s\n' "$YT_COOKIES" > /tmp/yt-cookies.txt
            COOKIE_ARGS=(--cookies /tmp/yt-cookies.txt)
            echo "using YT_COOKIES secret" | tee -a /tmp/attempts.log
          else
            echo "no cookies in use" | tee -a /tmp/attempts.log
          fi

          # PRIMARY: yt-download custom Innertube engine (Android/iOS client
          # contexts — the same-API-different-client fix, no yt-dlp involved).
          # From the runner's bare datacenter IP every client context is
          # bot-walled (their probe.py proved it), so it goes through WARP's
          # SOCKS5 via requests+pysocks — extraction+download both verified
          # working that way in run 36202206328 (killed only by our old
          # 300s cap at 53%; full video needs ~9-10 min at ~3MB/s).
          ENGINE_PROXY=()
          if [ "$WARP_READY" = "1" ]; then
            ENGINE_PROXY=(--proxy "socks5h://127.0.0.1:1080")
          fi
          if [ ! -s "${OUT}.mp4" ]; then
          echo "=== ATTEMPT engine yt-download ===" | tee -a /tmp/attempts.log
          mkdir -p /tmp/ytd
          if timeout 900 python3 /tmp/yt-download/cli.py \
              "https://www.youtube.com/watch?v=${VID}" -q 720 -o /tmp/ytd \
              "${ENGINE_PROXY[@]}" \
              > /tmp/ytcli.log 2>&1; then
            SRC="$(find /tmp/ytd -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.mkv' \) -size +1M 2>/dev/null | head -1)"
            echo "engine saved: [$SRC]" | tee -a /tmp/attempts.log
            if [ -n "$SRC" ]; then
              if ffmpeg -y -ss 30 -t 90 -i "$SRC" -c copy "${OUT}.section.mp4" >> /tmp/ytcli.log 2>&1 \
                 || ffmpeg -y -ss 30 -t 90 -i "$SRC" -c:v libx264 -preset veryfast -c:a aac "${OUT}.section.mp4" >> /tmp/ytcli.log 2>&1; then
                mv -f "${OUT}.section.mp4" "${OUT}.mp4"
                echo "engine section cut ok" | tee -a /tmp/attempts.log
              fi
            fi
          else
            echo "engine cli failed rc=$?" | tee -a /tmp/attempts.log
            # Which Innertube contexts does this IP have? (diagnostic)
            timeout 60 python3 /tmp/yt-download/probe.py "$VID" >> /tmp/ytcli.log 2>&1 || true
          fi
          tail -c 4000 /tmp/ytcli.log >> /tmp/attempts.log 2>/dev/null || true
          fi

          if [ ! -s "${OUT}.mp4" ]; then
          echo "engine did not produce output — falling back to yt-dlp paths" | tee -a /tmp/attempts.log

          yt_dl() {
            CLIENTS="$1"
            LABEL="$2"
            echo "=== ATTEMPT $LABEL clients=$CLIENTS warp=$WARP_READY ===" | tee -a /tmp/attempts.log
            ARGS=(
              -v --no-playlist
              --js-runtimes deno --js-runtimes node
            )
            EXTRA_FMT=()
            DST="${OUT}.%(ext)s"
            if [ "$WARP_READY" = "1" ]; then
              # ffmpeg (used for --download-sections) cannot SOCKS-proxy: it
              # would connect from the runner IP to a stream URL signed for the
              # WARP egress IP and get 403 (exit 8). Download FULL with the
              # native downloader (honors --proxy), cut the section locally.
              ARGS+=(--proxy "socks5h://127.0.0.1:1080")
              DST="/tmp/orbital_full.%(ext)s"
            else
              ARGS+=(--extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416")
              EXTRA_FMT=(--download-sections "*30-120" --force-keyframes-at-cuts --max-filesize 80M)
            fi
            if [ -n "$CLIENTS" ]; then
              ARGS+=(--extractor-args "youtube:player_client=${CLIENTS}")
            fi
            if [ ${#COOKIE_ARGS[@]} -gt 0 ]; then
              ARGS+=("${COOKIE_ARGS[@]}")
            fi
            yt-dlp "${ARGS[@]}" \
              -f "bv*[height<=720]+ba/b[height<=720]/b" \
              "${EXTRA_FMT[@]}" \
              --ffmpeg-location "$(command -v ffmpeg)" \
              -o "$DST" \
              "https://www.youtube.com/watch?v=${VID}" \
              2>&1 | tee -a /tmp/ytdlp.log | tail -60
            RC=${PIPESTATUS[0]}
            echo "attempt $LABEL rc=$RC" | tee -a /tmp/attempts.log
            return $RC
          }

          # WARP-first: plain invocation is exactly what the successful probe used
          # (run 36068187416 — default clients through socks5h://127.0.0.1:1080).
          # Direct fallback ladder kept for when the proxy is unavailable.
          if [ "$WARP_READY" = "1" ]; then
            yt_dl "" "warp-plain" \
              || yt_dl "web_safari" "warp-safari" \
              || yt_dl "tv,web_safari" "warp-tv-safari" \
              || yt_dl "android,ios,mweb" "warp-mobile" \
              || yt_dl "" "plain" \
              || true
          else
            yt_dl "tv,web_safari" "tv-safari" \
              || yt_dl "android_vr" "android-vr" \
              || yt_dl "web_embedded" "web-embedded" \
              || yt_dl "tv" "tv" \
              || yt_dl "web_safari" "safari" \
              || yt_dl "android,ios,mweb" "mobile" \
              || yt_dl "default,-android_sdkless" "default-nosdkless" \
              || yt_dl "" "plain" \
              || true
          fi
          fi

          # Cut a 90s section from the full WARP download (local ffmpeg —
          # no proxy needed, file is already on disk).
          if [ "$WARP_READY" = "1" ] && [ ! -s "${OUT}.mp4" ]; then
            FULL="$(ls -1 /tmp/orbital_full.* 2>/dev/null | grep -v '\.part$' | head -1)"
            echo "warp full file: [$FULL]" | tee -a /tmp/attempts.log
            if [ -n "$FULL" ]; then
              if ffmpeg -y -ss 30 -t 90 -i "$FULL" -c copy "${OUT}.section.mp4" >> /tmp/ytdlp.log 2>&1 \
                 || ffmpeg -y -ss 30 -t 90 -i "$FULL" -c:v libx264 -preset veryfast -c:a aac "${OUT}.section.mp4" >> /tmp/ytdlp.log 2>&1; then
                mv -f "${OUT}.section.mp4" "${OUT}.mp4"
                echo "warp section cut ok" | tee -a /tmp/attempts.log
              fi
            fi
          fi

          extract_url() {
            printf '%s' "$1" | jq -r '
              def http: strings and startswith("http");
              if type=="string" and startswith("http") then .
              elif type!="object" then empty
              elif (.url|http) then .url
              elif (.formatUrl|http) then .formatUrl
              elif ((.picker // []) | map(select(.url|http)) | first // empty) then (.picker | map(select(.url|http)) | first | .url)
              elif ((.videos // []) | map(select(.height==720 and (.url|http))) | first // empty) then (.videos | map(select(.height==720 and (.url|http))) | first | .url)
              else (((.formats // []) + (.adaptiveFormats // []))
                    | map(select((http|not) and ((.type // .mime // "") | contains("mp4")) and (.url|http)))
                    | first // empty | .url)
              end' 2>/dev/null || true
          }

          if [ ! -s "${OUT}.mp4" ] && ! ls "${OUT}".* >/dev/null 2>&1; then
            # Discover public cobalt APIs that allow unauthenticated YouTube pulls.
            APIS_TMP=$(mktemp)
            curl -sS --max-time 20 \
              -A 'soundwave-orbital-fetch/1.0 (+https://github.com/Str4hinj47/Soundwave-AI)' \
              'https://instances.cobalt.best/api' > /tmp/cobalt_instances.json || true
            echo "cobalt list bytes=$(wc -c </tmp/cobalt_instances.json 2>/dev/null || echo 0)" | tee -a /tmp/attempts.log
            jq -r '.[] | select(.online==true) | select((.info.auth // true)==false) | select(.services.youtube==true) | "https://\(.api)/"' \
              /tmp/cobalt_instances.json 2>/dev/null > "$APIS_TMP" || true
            # Always try a few known endpoints too
            {
              echo "https://api.cobalt.tools/"
              echo "https://cobalt-api.kwiatekmiki.com/"
              echo "https://cobalt-backend.canine.tools/"
              echo "https://capi.oak.li/"
            } >> "$APIS_TMP"
            while IFS= read -r API; do
              [ -n "$API" ] || continue
              case "$API" in https://*) ;; *) API="https://$API/" ;; esac
              echo "=== COBALT $API ===" | tee -a /tmp/attempts.log
              RESP=$(curl -sS --max-time 30 -X POST "$API" \
                -A 'soundwave-orbital-fetch/1.0' \
                -H 'Accept: application/json' \
                -H 'Content-Type: application/json' \
                -d "{\"url\":\"https://www.youtube.com/watch?v=${VID}\",\"videoQuality\":\"720\",\"filenameStyle\":\"basic\"}" \
                || true)
              echo "$RESP" | head -c 500 | tee -a /tmp/attempts.log
              echo >> /tmp/attempts.log
              URL=$(extract_url "$RESP")
              echo "url=[$URL]" | tee -a /tmp/attempts.log
              if [ -n "$URL" ]; then
                if curl -sSL --max-time 180 -A 'soundwave-orbital-fetch/1.0' -o "${OUT}.mp4" "$URL" && [ -s "${OUT}.mp4" ]; then
                  echo "cobalt ok" | tee -a /tmp/attempts.log
                  break
                fi
                rm -f "${OUT}.mp4" 2>/dev/null || true
              fi
            done < "$APIS_TMP"
          fi

          if [ ! -s "${OUT}.mp4" ]; then
            for IV in \
              "https://yewtu.be" \
              "https://invidious.f5.si" \
              "https://iv.ggtyler.dev" \
              "https://invidious.privacyredirect.com" \
              "https://vid.puffyan.us" \
              "https://pipedapi.kavin.rocks" \
              "https://api.piped.yt" \
              "https://watchapi.whatever.social"
            do
              echo "=== IV $IV ===" | tee -a /tmp/attempts.log
              for path in \
                "/api/v1/videos/${VID}" \
                "/api/v1/videos/${VID}?fields=adaptiveFormats,formatStreams" \
                "/streams/${VID}" \
                "/latest_version?id=${VID}&itag=22"
              do
                RESP=$(curl -sS --max-time 15 "${IV}${path}" || true)
                echo "$RESP" | head -c 300 | tee -a /tmp/attempts.log
                echo >> /tmp/attempts.log
                URL=$(extract_url "$RESP")
                if [ -n "$URL" ]; then
                  echo "iv url ok" | tee -a /tmp/attempts.log
                  if curl -sSL --max-time 180 -o "${OUT}.mp4" "$URL" && [ -s "${OUT}.mp4" ]; then
                    echo "iv ok" | tee -a /tmp/attempts.log
                    break 2
                  fi
                  rm -f "${OUT}.mp4" 2>/dev/null || true
                fi
              done
            done
          fi

          ls -lah background_cache/minecraft_parkour/downloads/ || true
          cat /tmp/attempts.log || true
          F="$(ls -1 background_cache/minecraft_parkour/downloads/orbital_${VID}.* 2>/dev/null | head -1 || true)"
          echo "got file: [$F]"
          test -n "$F" && test -s "$F"
          if [ -n "$F" ] && [ "${F##*.}" != "mp4" ]; then
            ffmpeg -y -i "$F" -c copy "${OUT}.mp4" && rm -f "$F"
          fi
          test -s "${OUT}.mp4"
          SZ=$(stat -c%s "${OUT}.mp4")
          echo "mp4 bytes=$SZ"
          if [ "$SZ" -gt 90000000 ]; then
            echo "mp4 too large for git ($SZ); trimming to 60s" | tee -a /tmp/attempts.log
            ffmpeg -y -i "${OUT}.mp4" -t 60 -c copy "${OUT}.trim.mp4" && mv "${OUT}.trim.mp4" "${OUT}.mp4"
            SZ=$(stat -c%s "${OUT}.mp4")
            echo "trimmed bytes=$SZ"
          fi
          test "$SZ" -le 100000000
      - name: Commit download
        if: always()
        run: |
          git config user.name "orbital-fetcher"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p background_cache/minecraft_parkour/downloads
          if [ -f /tmp/ytdlp.log ]; then
            {
              [ -f /tmp/warp.log ] && sed 's/^/[warp] /' /tmp/warp.log
              [ -f /tmp/warp_trace.txt ] && sed 's/^/[warp-trace] /' /tmp/warp_trace.txt
              cat /tmp/ytdlp.log
              cat /tmp/attempts.log
            } > background_cache/minecraft_parkour/downloads/last_ytdlp.log 2>/dev/null || cp /tmp/ytdlp.log background_cache/minecraft_parkour/downloads/last_ytdlp.log || true
          elif [ -f /tmp/attempts.log ]; then
            cp /tmp/attempts.log background_cache/minecraft_parkour/downloads/last_ytdlp.log || true
          fi
          # Commit log first so diagnostics land even if the video push fails.
          git add -f background_cache/minecraft_parkour/downloads/last_ytdlp.log || true
          git commit -m "fetch log: orbital ${{ steps.vid.outputs.id }}" || true
          git push origin main || true
          # Then the video (must be <100MB for git).
          git add -f background_cache/minecraft_parkour/downloads/ || true
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "fetch: orbital ${{ steps.vid.outputs.id }}"
            git push origin main || echo "PUSH_FAILED — video commit stayed local"
          fi
          # Persist a freshly registered WARP account so future runs skip
          # registration (Cloudflare 429s new registrations per IP).
          if ls .github/warp/*.toml >/dev/null 2>&1; then
            git add -f .github/warp/ || true
            if ! git diff --cached --quiet; then
              git commit -m "warp: persist WARP account for CI fetch" || true
              git push origin main || true
            fi
          fi
