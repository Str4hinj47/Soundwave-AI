name: Fetch Orbital Clip
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video id
        required: true
        default: fw_eWpb7uCE
  push:
    branches: [main]
    paths:
      - ".github/fetch-orbital.trigger"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install -U yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Determine video id
        id: vid
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.video_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=$(head -1 .github/fetch-orbital.trigger | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
          fi
      - name: Download Orbital section
        run: |
          mkdir -p background_cache/minecraft_parkour/downloads
          yt-dlp --no-playlist --no-warnings             -f 'bv*[height<=1080][ext=mp4]+ba[ext=m4a]/b[height<=1080]/b'             --download-sections '*00:30-04:30' --force-keyframes-at-cuts             -o "background_cache/minecraft_parkour/downloads/orbital_${{ steps.vid.outputs.id }}.mp4"             "https://www.youtube.com/watch?v=${{ steps.vid.outputs.id }}"
          ls -lah background_cache/minecraft_parkour/downloads/
          test -s "background_cache/minecraft_parkour/downloads/orbital_${{ steps.vid.outputs.id }}.mp4"
      - name: Commit download
        run: |
          git config user.name "orbital-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add -f background_cache/minecraft_parkour/downloads/
          git commit -m "fetch: orbital ${{ steps.vid.outputs.id }}" || true
          git push origin main || true
