<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Soundwave AI — professional text-to-speech with custom subtitles and video export. Powered by neural voices, running privately in your browser." />
    <meta name="theme-color" content="#16191D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Soundwave AI — Text-to-Speech, Subtitles &amp; Video Export</title>
    <script>
      // Resolve the saved theme before first paint so there is no flash.
      (function () {
        try {
          var stored = localStorage.getItem("soundwave:theme");
          var mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var light =
            mode === "light" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          var theme = light ? "light" : "dark";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle("dark", theme === "dark");
          root.classList.toggle("light", theme === "light");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#16191D" : "#F7F6F2");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
