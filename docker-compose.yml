# ── Soundwave AI — Docker Compose ─────────────────────────────────────────
# Production topology: Postgres + Redis + API + Nginx (static + reverse proxy).
#
#   docker compose up --build
#
# The API auto-selects the Prisma store when DATABASE_URL is a postgres URL;
# without it, it falls back to the JSON file store (useful for smoke tests).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soundwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soundwave}
      POSTGRES_DB: soundwave
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundwave"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "4000"
      APP_URL: ${APP_URL:-https://app.soundwave.ai}
      DATABASE_URL: postgresql://soundwave:${POSTGRES_PASSWORD:-soundwave}@db:5432/soundwave
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-${JWT_SECRET:?set JWT_ACCESS_SECRET or JWT_SECRET in .env}}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-${JWT_SECRET:?set JWT_REFRESH_SECRET or JWT_SECRET in .env}}
      CORS_ORIGINS: ${CORS_ORIGINS:-${APP_URL:-https://app.soundwave.ai}}
      EMAIL_FROM: ${EMAIL_FROM:-${SMTP_FROM:-Soundwave AI <no-reply@soundwave.ai>}}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FFMPEG_PATH: /usr/bin/ffmpeg
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
      - generated:/app/data/generated

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - webcerts:/etc/nginx/certs

volumes:
  pgdata:
  redisdata:
  uploads:
  generated:
  webcerts:
